<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Snap</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #ece1c8;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 1.5rem 1.75rem;
      pointer-events: none;
    }
    header * { pointer-events: auto; }
    header h1 {
      margin: 0;
      font-size: 1.15rem;
      letter-spacing: 0.02em;
      color: #4a4130;
    }
    header p {
      margin: 0.2rem 0 0;
      font-size: 0.8rem;
      color: #8c7f63;
    }
    a.closet-link {
      text-decoration: none;
      color: #4a4130;
      background: #f8f2e2;
      border: 1px solid #d9c9a3;
      padding: 0.5rem 1.1rem;
      border-radius: 999px;
      font-size: 0.85rem;
      white-space: nowrap;
    }
    #globeViz { position: fixed; inset: 0; }
    .hint {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.8rem;
      color: #8c7f63;
      z-index: 10;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>📸 Project Snap</h1>
      <p>Regional style, one spin away — click-to-explore coming next.</p>
    </div>
    <a class="closet-link" href="/closet.html">My Closet →</a>
  </header>

  <div id="globeViz"></div>
  <p class="hint">Drag to spin</p>

  <script src="https://unpkg.com/globe.gl@2.46.2/dist/globe.gl.min.js"></script>
  <script src="globe.js"></script>
</body>
</html>
