<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>fitd</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800&family=Bodoni+Moda:opsz,wght@6..96,700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <a href="/" class="back-link">← Globe</a>
    <h1>fitd</h1>
    <p>Your wardrobe, understood by AI.</p>
  </header>

  <main>
    <!-- FIT PASSPORT -->
    <section class="active">
      <div class="card passport" id="passport">
        <h2>My fit passport</h2>
        <p class="passport-summary"></p>
        <div class="stamps"></div>
      </div>
    </section>

    <!-- WARDROBE -->
    <section id="wardrobe" class="active">
      <div class="card">
        <h2>Add an item</h2>
        <p class="muted">Snap a photo of a garment — Gemini will tag it (category, colors, style, season) automatically.</p>
        <label class="upload">
          Choose photo
          <input type="file" id="photoInput" accept="image/*" capture="environment" />
        </label>
        <span id="uploadStatus" class="muted"></span>
      </div>
      <div class="card">
        <h2>Your Wardrobe (<span id="itemCount">0</span>)</h2>
        <p class="muted">Saved only in this browser on this device.</p>
        <div id="wardrobeGrid" class="grid"></div>
      </div>
    </section>
  </main>

  <script src="closet.js"></script>
  <script type="module" src="track.js"></script>
  <script type="module" src="passport-view.js"></script>
</body>
</html>
