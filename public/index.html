<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Snap</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #ece1c8;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 1.5rem 1.75rem;
      pointer-events: none;
    }
    header * { pointer-events: auto; }
    header h1 {
      margin: 0;
      font-size: 1.15rem;
      letter-spacing: 0.02em;
      color: #4a4130;
    }
    header p {
      margin: 0.2rem 0 0;
      font-size: 0.8rem;
      color: #8c7f63;
    }
    a.closet-link {
      text-decoration: none;
      color: #4a4130;
      background: #f8f2e2;
      border: 1px solid #d9c9a3;
      padding: 0.5rem 1.1rem;
      border-radius: 999px;
      font-size: 0.85rem;
      white-space: nowrap;
    }
    #globeViz { position: fixed; inset: 0; cursor: grab; }
    #globeViz:active { cursor: grabbing; }
    .hint {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.8rem;
      color: #8c7f63;
      z-index: 10;
    }
    #markerTooltip {
      position: fixed;
      z-index: 20;
      background: #4a4130;
      color: #f8f2e2;
      font-size: 0.75rem;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      pointer-events: none;
    }
    .controls {
      position: fixed;
      bottom: 1.5rem;
      right: 1.75rem;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .controls button {
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 999px;
      border: 1px solid #d9c9a3;
      background: #f8f2e2;
      color: #4a4130;
      font-size: 1rem;
      cursor: pointer;
    }
    #regionPopup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 30;
      background: #f8f2e2;
      border: 1px solid #d9c9a3;
      border-radius: 12px;
      padding: 1.25rem 1.5rem 1.5rem;
      width: min(420px, 90vw);
      box-shadow: 0 10px 30px rgba(74, 65, 48, 0.2);
      color: #4a4130;
    }
    #regionPopup h3 { margin: 0 0 0.6rem; }
    #regionPopup p { margin: 0; font-size: 0.85rem; color: #8c7f63; }
    .popup-year {
      width: 100%;
      padding: 0.4rem 0.6rem;
      margin-bottom: 0.9rem;
      border: 1px solid #d9c9a3;
      border-radius: 8px;
      background: #fff;
      color: #4a4130;
      font-size: 0.85rem;
    }
    .popup-images {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.4rem;
      max-height: 260px;
      overflow-y: auto;
    }
    .popup-images a { display: block; line-height: 0; }
    .popup-images img {
      width: 100%;
      height: 70px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #d9c9a3;
    }
    .popup-close {
      position: absolute;
      top: 0.5rem;
      right: 0.6rem;
      border: none;
      background: none;
      font-size: 1.1rem;
      cursor: pointer;
      color: #8c7f63;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>📸 Project Snap</h1>
      <p>Regional style, one spin away — click a pin to preview it.</p>
    </div>
    <a class="closet-link" href="/closet.html">My Closet →</a>
  </header>

  <div id="globeViz"></div>
  <p class="hint">Drag to spin</p>
  <p id="markerTooltip" hidden></p>
  <div id="regionPopup" hidden></div>

  <div class="controls">
    <button id="zoomIn" aria-label="Zoom in">+</button>
    <button id="zoomOut" aria-label="Zoom out">−</button>
    <button id="resetView" aria-label="Reset view">⟳</button>
  </div>

  <script type="module" src="globe.js"></script>
</body>
</html>
