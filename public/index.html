<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>fitd</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #ece1c8;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 1.5rem 1.75rem;
      pointer-events: none;
    }
    header * { pointer-events: auto; }
    header h1 {
      margin: 0;
      font-size: 1.15rem;
      letter-spacing: 0.02em;
      color: #4a4130;
    }
    header p {
      margin: 0.2rem 0 0;
      font-size: 0.8rem;
      color: #8c7f63;
    }
    a.closet-link {
      text-decoration: none;
      color: #4a4130;
      background: #f8f2e2;
      border: 1px solid #d9c9a3;
      padding: 0.5rem 1.1rem;
      border-radius: 999px;
      font-size: 0.85rem;
      white-space: nowrap;
    }
    #globeViz { position: fixed; inset: 0; cursor: grab; touch-action: none; overflow: hidden; }
    /* canvas is inline by default, which adds a baseline gap below it */
    #globeViz canvas { display: block; }
    #globeViz:active { cursor: grabbing; }
    .city-match-btn {
      position: fixed;
      bottom: calc(1.5rem + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      padding: 0.85rem 1.6rem;
      border: none;
      border-radius: 999px;
      background: #a8452b;
      color: #f8f2e2;
      font-size: 1rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(168, 69, 43, 0.35);
    }
    .city-match-btn:active { transform: translateX(-50%) scale(0.97); }

    /* City-match result: a bottom sheet, kept under half the screen so the
       matched city (centered on the globe) stays visible above it. */
    #cityMatchCard[hidden] { display: none; }
    #cityMatchCard {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      z-index: 35;
      width: min(440px, 100%);
      max-height: 46dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #f8f2e2;
      border: 1px solid #d9c9a3;
      border-bottom: none;
      border-radius: 18px 18px 0 0;
      box-shadow: 0 -10px 30px rgba(74, 65, 48, 0.2);
      color: #4a4130;
      font-size: 0.85rem;
    }
    #cityMatchCard p { margin: 0.3rem 0 0; }
    /* The details scroll; the action bar below them is always on screen. */
    .match-body {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      padding: 1.25rem 1.25rem 0.9rem;
    }
    .match-explore {
      display: inline-block;
      margin-top: 0.6rem;
      padding: 0;
      border: none;
      background: none;
      color: #a8452b;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }
    .match-eyebrow {
      margin: 0 !important;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #8c7f63;
    }
    .match-headline { margin: 0.1rem 0 0.2rem; font-size: 1.7rem; line-height: 1.15; }
    .match-pct { font-weight: 800; }
    .match-verdict { font-weight: 600; font-size: 0.95rem; }
    #cityMatchCard .fit-reasoning { margin-top: 0.5rem; line-height: 1.5; }
    .match-runners-title {
      margin-top: 0.9rem !important;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #8c7f63;
    }
    .match-runners { list-style: none; margin: 0.35rem 0 0; padding: 0; }
    .match-runners button {
      display: grid;
      grid-template-columns: 7.5rem 1fr 2.6rem;
      align-items: center;
      gap: 0.6rem;
      width: 100%;
      padding: 0.35rem 0;
      border: none;
      background: none;
      color: #4a4130;
      font-size: 0.85rem;
      text-align: left;
      cursor: pointer;
    }
    .runner-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .runner-bar { height: 6px; border-radius: 999px; background: #ece1c8; overflow: hidden; }
    .runner-bar span { display: block; height: 100%; border-radius: 999px; background: #c98a3b; }
    .runner-pct { text-align: right; color: #8c7f63; font-variant-numeric: tabular-nums; }
    .match-actions {
      flex-shrink: 0;
      display: flex;
      gap: 0.5rem;
      padding: 0.75rem 1.25rem calc(0.75rem + env(safe-area-inset-bottom));
      border-top: 1px solid #e6d9b8;
      background: #f8f2e2;
    }
    .match-actions .share-fit-btn { flex: 1.4; margin: 0; }
    .match-actions .retry-btn {
      flex: 1;
      padding: 0.6rem;
      border: 1px solid #d9c9a3;
      border-radius: 999px;
      background: #fff;
      color: #4a4130;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .progress { display: flex; align-items: center; gap: 0.75rem; text-align: left; }
    .progress p { margin: 0 !important; }
    .spinner {
      flex-shrink: 0;
      width: 1.25rem;
      height: 1.25rem;
      border: 2.5px solid #d9c9a3;
      border-top-color: #a8452b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #markerTooltip {
      position: fixed;
      z-index: 20;
      background: #4a4130;
      color: #f8f2e2;
      font-size: 0.75rem;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      pointer-events: none;
    }
    .controls {
      position: fixed;
      bottom: 1.5rem;
      right: 1.75rem;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .controls button {
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 999px;
      border: 1px solid #d9c9a3;
      background: #f8f2e2;
      color: #4a4130;
      font-size: 1rem;
      cursor: pointer;
    }
    #regionPopup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 30;
      background: #f8f2e2;
      border: 1px solid #d9c9a3;
      border-radius: 12px;
      padding: 1.25rem 1.5rem 1.5rem;
      width: min(420px, 90vw);
      max-height: 85vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      box-shadow: 0 10px 30px rgba(74, 65, 48, 0.2);
      color: #4a4130;
    }
    #regionPopup h3 { margin: 0 0 0.6rem; }
    #regionPopup p { margin: 0; font-size: 0.85rem; color: #8c7f63; }
    .popup-year {
      width: 100%;
      padding: 0.4rem 0.6rem;
      margin-bottom: 0.9rem;
      border: 1px solid #d9c9a3;
      border-radius: 8px;
      background: #fff;
      color: #4a4130;
      font-size: 0.85rem;
    }
    .style-heading {
      margin: 0.9rem 0 0.4rem;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #8c7f63;
    }
    .style-heading:first-child { margin-top: 0; }
    .style-images {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.4rem;
    }
    .popup-images img {
      width: 100%;
      height: 70px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #d9c9a3;
      cursor: zoom-in;
      display: block;
    }
    .popup-close {
      position: absolute;
      top: 0.5rem;
      right: 0.6rem;
      border: none;
      background: none;
      font-size: 1.1rem;
      cursor: pointer;
      color: #8c7f63;
    }
    #imageLightbox[hidden] { display: none; }
    #imageLightbox {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(35, 30, 20, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 2rem;
      touch-action: pan-y;
    }
    #imageLightbox img {
      max-width: 92vw;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }
    #imageLightbox a {
      color: #f8f2e2;
      font-size: 0.85rem;
      text-decoration: underline;
    }
    .lightbox-close {
      position: fixed;
      top: 1.25rem;
      right: 1.5rem;
      z-index: 41;
      border: none;
      background: rgba(248, 242, 226, 0.9);
      color: #4a4130;
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 999px;
      font-size: 1.1rem;
      cursor: pointer;
    }
    .fit-check-btn {
      display: block;
      width: 100%;
      margin-top: 0.9rem;
      padding: 0.6rem;
      border: 1px solid #a8452b;
      border-radius: 8px;
      background: #a8452b;
      color: #f8f2e2;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    #fitCheckPanel[hidden] { display: none; }
    /* Full-screen camera: the video fills the screen behind everything, the
       title floats at the top, and the result + capture button stack at the
       bottom. The result scrolls inside its own card, so the capture button
       always stays on screen. */
    #fitCheckPanel {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      gap: 0.9rem;
      padding: 1rem 1rem calc(1.5rem + env(safe-area-inset-bottom));
      color: #f8f2e2;
      touch-action: pan-y;
    }
    #fitCheckPanel > * { position: relative; z-index: 1; flex-shrink: 0; }
    #fitCheckPanel h3 {
      position: absolute;
      top: calc(1.4rem + env(safe-area-inset-top));
      left: 1.25rem;
      right: 4rem; /* leave room for the close button */
      margin: 0;
      font-size: 1rem;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.7);
    }
    #fitCheckPanel .lightbox-close { position: fixed; z-index: 2; }
    #fitCheckPublisher {
      position: absolute;
      inset: 0;
      z-index: 0;
      background: #000;
    }
    /* Mirror the live preview like a phone's selfie camera, so moving right
       moves right on screen. The captured photo is drawn from the raw stream,
       so it stays un-mirrored and logos/text on clothes read correctly. */
    #fitCheckPublisher video { transform: scaleX(-1); }
    #fitCheckActions { display: flex; flex-direction: column; align-items: center; gap: 0.7rem; }
    #fitCheckCapture {
      padding: 0.85rem 1.6rem;
      border-radius: 999px;
      border: none;
      background: #f8f2e2;
      color: #4a4130;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
    }
    #fitCheckCapture:disabled { opacity: 0.6; cursor: not-allowed; }
    .timer-toggle {
      display: flex;
      gap: 0.2rem;
      padding: 0.2rem;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    .timer-toggle button {
      min-width: 3.2rem;
      padding: 0.4rem 0.8rem;
      border: none;
      border-radius: 999px;
      background: none;
      color: #f8f2e2;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    .timer-toggle button[aria-checked="true"] { background: #f8f2e2; color: #4a4130; }
    .timer-toggle button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Big countdown number over the camera; each number pops in. */
    #fitCheckCountdown[hidden] { display: none; }
    #fitCheckCountdown {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9rem;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
      pointer-events: none;
    }
    #fitCheckCountdown.tick { animation: countdown-pop 1s ease-out; }
    @keyframes countdown-pop {
      0% { transform: scale(1.4); opacity: 0; }
      20% { transform: scale(1); opacity: 1; }
      85% { opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.3; }
    }
    /* White flash at the moment the photo is taken. */
    #fitCheckFlash {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: #fff;
      opacity: 0;
      pointer-events: none;
    }
    #fitCheckFlash.flash { animation: camera-flash 0.45s ease-out; }
    @keyframes camera-flash { 0% { opacity: 0.85; } 100% { opacity: 0; } }
    #fitCheckResult {
      width: min(420px, 100%);
      max-height: 55dvh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      background: rgba(248, 242, 226, 0.96);
      color: #4a4130;
      border-radius: 16px;
      padding: 1.25rem;
      font-size: 0.85rem;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
    }
    #fitCheckResult p { margin: 0.3rem 0 0; color: #4a4130; }
    #fitCheckResult .muted { color: #8c7f63; }
    .fit-score-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      margin: 0 auto 0.85rem;
      color: #fff;
      box-shadow: 0 8px 22px rgba(74, 65, 48, 0.3);
    }
    .fit-score-num { font-size: 2.1rem; font-weight: 800; line-height: 1; }
    .fit-score-max { font-size: 0.85rem; opacity: 0.85; margin-left: 2px; }
    .fit-verdict { margin: 0 0 0.6rem; font-size: 1.3rem; font-weight: 700; }
    .fit-closest {
      margin: -0.3rem 0 0.6rem !important;
      font-size: 0.8rem;
      font-weight: 600;
      color: #8c7f63 !important;
    }
    .fit-reasoning { text-align: left; line-height: 1.5; }
    .share-fit-btn {
      display: block;
      width: 100%;
      margin-top: 1rem;
      padding: 0.7rem;
      border: none;
      border-radius: 999px;
      background: #a8452b;
      color: #f8f2e2;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }
    .share-fit-btn:disabled { opacity: 0.6; cursor: wait; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>fitd</h1>
      <p>Where your fit fits in.</p>
    </div>
    <a class="closet-link" href="/closet.html">My Closet →</a>
  </header>

  <div id="globeViz"></div>
  <button id="cityMatchBtn" class="city-match-btn">Fit Check</button>
  <div id="cityMatchCard" hidden></div>
  <p id="markerTooltip" hidden></p>
  <div id="regionPopup" hidden></div>

  <div id="imageLightbox" hidden>
    <button class="lightbox-close" aria-label="Close">×</button>
    <img id="lightboxImg" alt="" />
    <a id="lightboxSource" href="#" target="_blank" rel="noopener noreferrer">View original ↗</a>
  </div>

  <div id="fitCheckPanel" hidden>
    <button class="lightbox-close" id="fitCheckClose" aria-label="Close">×</button>
    <h3 id="fitCheckTitle">Fit Check</h3>
    <div id="fitCheckPublisher"></div>
    <div id="fitCheckCountdown" aria-live="assertive" hidden></div>
    <div id="fitCheckFlash" aria-hidden="true"></div>
    <div id="fitCheckResult" hidden></div>
    <div id="fitCheckActions">
      <div class="timer-toggle" role="radiogroup" aria-label="Timer">
        <button role="radio" data-timer="0" aria-checked="true">Now</button>
        <button role="radio" data-timer="3" aria-checked="false">3s</button>
        <button role="radio" data-timer="5" aria-checked="false">5s</button>
      </div>
      <button id="fitCheckCapture">Capture &amp; Score</button>
    </div>
  </div>

  <div class="controls">
    <button id="zoomIn" aria-label="Zoom in">+</button>
    <button id="zoomOut" aria-label="Zoom out">−</button>
    <button id="resetView" aria-label="Reset view">⟳</button>
  </div>

  <script type="module" src="globe.js"></script>
</body>
</html>
