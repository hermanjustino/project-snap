<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>fitd</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #ece1c8;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 1.5rem 1.75rem;
      pointer-events: none;
    }
    header * { pointer-events: auto; }
    header h1 {
      margin: 0;
      font-size: 1.15rem;
      letter-spacing: 0.02em;
      color: #4a4130;
    }
    header p {
      margin: 0.2rem 0 0;
      font-size: 0.8rem;
      color: #8c7f63;
    }
    a.closet-link {
      text-decoration: none;
      color: #4a4130;
      background: #f8f2e2;
      border: 1px solid #d9c9a3;
      padding: 0.5rem 1.1rem;
      border-radius: 999px;
      font-size: 0.85rem;
      white-space: nowrap;
    }
    #globeViz { position: fixed; inset: 0; cursor: grab; touch-action: none; }
    #globeViz:active { cursor: grabbing; }
    .hint {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.8rem;
      color: #8c7f63;
      z-index: 10;
    }
    #markerTooltip {
      position: fixed;
      z-index: 20;
      background: #4a4130;
      color: #f8f2e2;
      font-size: 0.75rem;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      pointer-events: none;
    }
    .controls {
      position: fixed;
      bottom: 1.5rem;
      right: 1.75rem;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .controls button {
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 999px;
      border: 1px solid #d9c9a3;
      background: #f8f2e2;
      color: #4a4130;
      font-size: 1rem;
      cursor: pointer;
    }
    #regionPopup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 30;
      background: #f8f2e2;
      border: 1px solid #d9c9a3;
      border-radius: 12px;
      padding: 1.25rem 1.5rem 1.5rem;
      width: min(420px, 90vw);
      max-height: 85vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      box-shadow: 0 10px 30px rgba(74, 65, 48, 0.2);
      color: #4a4130;
    }
    #regionPopup h3 { margin: 0 0 0.6rem; }
    #regionPopup p { margin: 0; font-size: 0.85rem; color: #8c7f63; }
    .popup-year {
      width: 100%;
      padding: 0.4rem 0.6rem;
      margin-bottom: 0.9rem;
      border: 1px solid #d9c9a3;
      border-radius: 8px;
      background: #fff;
      color: #4a4130;
      font-size: 0.85rem;
    }
    .popup-images {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.4rem;
    }
    .popup-images img {
      width: 100%;
      height: 70px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #d9c9a3;
      cursor: zoom-in;
      display: block;
    }
    .popup-close {
      position: absolute;
      top: 0.5rem;
      right: 0.6rem;
      border: none;
      background: none;
      font-size: 1.1rem;
      cursor: pointer;
      color: #8c7f63;
    }
    #imageLightbox[hidden] { display: none; }
    #imageLightbox {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: rgba(35, 30, 20, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 2rem;
      touch-action: pan-y;
    }
    #imageLightbox img {
      max-width: 92vw;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }
    #imageLightbox a {
      color: #f8f2e2;
      font-size: 0.85rem;
      text-decoration: underline;
    }
    .lightbox-close {
      position: fixed;
      top: 1.25rem;
      right: 1.5rem;
      z-index: 41;
      border: none;
      background: rgba(248, 242, 226, 0.9);
      color: #4a4130;
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 999px;
      font-size: 1.1rem;
      cursor: pointer;
    }
    .fit-check-btn {
      display: block;
      width: 100%;
      margin-top: 0.9rem;
      padding: 0.6rem;
      border: 1px solid #a8452b;
      border-radius: 8px;
      background: #a8452b;
      color: #f8f2e2;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    #fitCheckPanel[hidden] { display: none; }
    #fitCheckPanel {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(35, 30, 20, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 1.5rem;
      color: #f8f2e2;
      touch-action: pan-y;
    }
    #fitCheckPanel h3 { margin: 0; }
    #fitCheckPublisher {
      width: min(420px, 90vw);
      height: min(320px, 60vh);
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }
    #fitCheckActions { display: flex; gap: 0.6rem; }
    #fitCheckActions button {
      padding: 0.6rem 1.2rem;
      border-radius: 999px;
      border: 1px solid #d9c9a3;
      background: #f8f2e2;
      color: #4a4130;
      font-size: 0.85rem;
      cursor: pointer;
    }
    #fitCheckActions button:disabled { opacity: 0.5; cursor: not-allowed; }
    #fitCheckResult {
      width: min(420px, 90vw);
      background: #f8f2e2;
      color: #4a4130;
      border-radius: 12px;
      padding: 1.25rem;
      font-size: 0.85rem;
      text-align: center;
    }
    #fitCheckResult p { margin: 0.3rem 0 0; color: #4a4130; }
    #fitCheckResult .muted { color: #8c7f63; }
    .fit-score-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      margin: 0 auto 0.85rem;
      color: #fff;
      box-shadow: 0 8px 22px rgba(74, 65, 48, 0.3);
    }
    .fit-score-num { font-size: 2.1rem; font-weight: 800; line-height: 1; }
    .fit-score-max { font-size: 0.85rem; opacity: 0.85; margin-left: 2px; }
    .fit-verdict { margin: 0 0 0.6rem; font-size: 1.3rem; font-weight: 700; }
    .fit-reasoning { text-align: left; line-height: 1.5; }
    .fit-tip {
      margin: 0.9rem 0 0;
      padding: 0.65rem 0.85rem;
      background: #fdf0d5;
      border-left: 3px solid #c98a3b;
      border-radius: 6px;
      text-align: left;
      color: #6b5842;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>📸 fitd</h1>
      <p>Regional style, one spin away — click a pin to preview it.</p>
    </div>
    <a class="closet-link" href="/closet.html">My Closet →</a>
  </header>

  <div id="globeViz"></div>
  <p class="hint">Drag to spin</p>
  <p id="markerTooltip" hidden></p>
  <div id="regionPopup" hidden></div>

  <div id="imageLightbox" hidden>
    <button class="lightbox-close" aria-label="Close">×</button>
    <img id="lightboxImg" alt="" />
    <a id="lightboxSource" href="#" target="_blank" rel="noopener noreferrer">View original ↗</a>
  </div>

  <div id="fitCheckPanel" hidden>
    <button class="lightbox-close" id="fitCheckClose" aria-label="Close">×</button>
    <h3 id="fitCheckTitle">Fit Check</h3>
    <div id="fitCheckPublisher"></div>
    <div id="fitCheckActions">
      <button id="fitCheckCapture">📸 Capture &amp; Score</button>
    </div>
    <div id="fitCheckResult" hidden></div>
  </div>

  <div class="controls">
    <button id="zoomIn" aria-label="Zoom in">+</button>
    <button id="zoomOut" aria-label="Zoom out">−</button>
    <button id="resetView" aria-label="Reset view">⟳</button>
  </div>

  <script type="module" src="globe.js"></script>
</body>
</html>
